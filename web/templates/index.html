<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maps → Coordenadas</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="card">
    <h1>📍 Maps → Coordenadas</h1>
    <p class="subtitle">Link corto de Google Maps · lat, lon</p>

    <form id="form">
      <label>Link de Google Maps</label>
      <textarea id="url" name="url" rows="1" placeholder="https://maps.app.goo.gl/…"></textarea>
      <button type="button" class="secondary" id="clear">Limpiar</button>

      <button type="submit" class="primary" id="submit">Obtener coordenadas</button>
    </form>

    <div class="result" id="result" hidden>
      <div class="coords" id="coords"></div>
      <button type="button" class="secondary" id="copy">Copiar</button>
    </div>

    <p class="status" id="status"></p>
  </main>

  <script>
    // URL de tu Cloudflare Worker (expande los links cortos goo.gl).
    // Reemplaza por la que te da Cloudflare al desplegarlo.
    const WORKER = "https://maps.yago-clerigo-grok.workers.dev";

    const urlField = document.getElementById('url');
    const form = document.getElementById('form');
    const status = document.getElementById('status');
    const submit = document.getElementById('submit');
    const result = document.getElementById('result');
    const coordsEl = document.getElementById('coords');
    const copyBtn = document.getElementById('copy');

    document.getElementById('clear').addEventListener('click', () => {
      urlField.value = '';
      urlField.focus();
    });

    copyBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(coordsEl.textContent);
      copyBtn.textContent = '¡Copiado!';
      setTimeout(() => (copyBtn.textContent = 'Copiar'), 1200);
    });

    form.addEventListener('submit', async e => {
      e.preventDefault();
      result.hidden = true;
      status.className = 'status';
      status.textContent = 'Resolviendo…';
      submit.disabled = true;
      try {
        let link = urlField.value.trim();
        if (/goo\.gl/.test(link)) {
          status.textContent = 'Expandiendo link corto…';
          const wr = await fetch(WORKER + '?url=' + encodeURIComponent(link));
          const wd = await wr.json();
          if (!wr.ok || !wd.url) throw new Error(wd.error || 'No se pudo expandir el link corto');
          link = wd.url;
        }
        status.textContent = 'Resolviendo…';
        const body = new FormData();
        body.append('url', link);
        const resp = await fetch('/coords', { method: 'POST', body });
        const data = await resp.json();
        if (!resp.ok) {
          status.className = 'status error';
          status.textContent = '⚠ ' + (data.error || 'Error');
          return;
        }
        coordsEl.textContent = data.lat + ', ' + data.lon;
        result.hidden = false;
        status.textContent = '';
      } catch (err) {
        status.className = 'status error';
        status.textContent = '⚠ ' + err.message;
      } finally {
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
